#cloud-config
# Paste into Vultr: Deploy -> Cloud Compute -> Additional Features -> "Cloud-Init User-Data".
# Installs Docker, opens SSH/HTTP/HTTPS, adds 4 GB swap (Chromium per customer is memory-hungry).
package_update: true
packages: [ca-certificates, curl, rsync, ufw]
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable
  - mkdir -p /root/app/runs
  - touch /root/cloud-init-done
